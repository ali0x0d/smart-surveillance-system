<svg xmlns="http://www.w3.org/2000/svg" width="852" height="162" viewBox="0 0 852 162" role="img" aria-labelledby="title">
  <title id="title">How the camera, edge device, server and web dashboard connect</title>
  <style>
    .bg { fill: #ffffff; }
    .zone { fill: none; stroke: #afb8c1; stroke-width: 1.2; stroke-dasharray: 6 5; }
    .card { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 1; }
    .icon { fill: none; stroke: #0969da; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .dot { fill: #0969da; }
    .line { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .head { fill: #59636e; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; text-anchor: middle; }
    .name { font-size: 15px; font-weight: 600; fill: #1f2328; }
    .desc { font-size: 12.5px; fill: #59636e; }
    .label { font-size: 12px; fill: #59636e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .zone { stroke: #59636e; }
      .card { fill: #151b23; stroke: #3d444d; }
      .icon { stroke: #4493f8; }
      .dot { fill: #4493f8; }
      .line { stroke: #9198a1; }
      .head { fill: #9198a1; }
      .name { fill: #f0f6fc; }
      .desc, .label { fill: #9198a1; }
    }
  </style>

  <rect class="bg" width="852" height="162" rx="8"/>

  <!-- Dashed border: the camera and the edge device are in the same place -->
  <rect class="zone" x="8" y="8" width="318" height="146" rx="14"/>

  <!-- Camera -->
  <g class="icon">
    <circle cx="62" cy="64" r="14"/>
    <circle cx="62" cy="64" r="5.5"/>
    <path d="M62 78v6M53 86h18"/>
  </g>
  <text class="name" x="62" y="110">Camera</text>

  <!-- Camera -> edge device -->
  <path class="line" d="M96 81H146"/>
  <path class="head" d="M153 81l-8-4.5v9z"/>

  <!-- Edge device -->
  <rect class="card" x="160" y="22" width="150" height="118" rx="10"/>
  <g class="icon">
    <rect x="225" y="42" width="20" height="20" rx="3"/>
    <rect x="231" y="48" width="8" height="8" rx="1"/>
    <path d="M230 38v4M235 38v4M240 38v4M230 62v4M235 62v4M240 62v4M221 47h4M221 52h4M221 57h4M245 47h4M245 52h4M245 57h4"/>
  </g>
  <text class="name" x="235" y="88">Edge device</text>
  <text class="desc" x="235" y="108">analyzes the video</text>
  <text class="desc" x="235" y="124">in real time</text>

  <!-- Edge device <-> server -->
  <text class="label" x="408" y="61">live video and events</text>
  <path class="line" d="M316 70H476"/>
  <path class="head" d="M484 70l-8-4.5v9z"/>
  <path class="line" d="M324 92H484"/>
  <path class="head" d="M316 92l8-4.5v9z"/>
  <text class="label" x="408" y="110">commands</text>

  <!-- Server -->
  <rect class="card" x="490" y="22" width="150" height="118" rx="10"/>
  <g class="icon">
    <rect x="553" y="39" width="24" height="11" rx="2.5"/>
    <rect x="553" y="54" width="24" height="11" rx="2.5"/>
    <path d="M566 44.5h6M566 59.5h6"/>
  </g>
  <circle class="dot" cx="558.5" cy="44.5" r="1.4"/>
  <circle class="dot" cx="558.5" cy="59.5" r="1.4"/>
  <text class="name" x="565" y="88">Server</text>
  <text class="desc" x="565" y="108">stores events</text>
  <text class="desc" x="565" y="124">and sends alerts</text>

  <!-- Server <-> web dashboard -->
  <path class="line" d="M656 81H676"/>
  <path class="head" d="M648 81l8-4.5v9z"/>
  <path class="head" d="M684 81l-8-4.5v9z"/>

  <!-- Web dashboard -->
  <rect class="card" x="692" y="22" width="150" height="118" rx="10"/>
  <g class="icon">
    <rect x="753" y="39" width="28" height="24" rx="3"/>
    <path d="M753 45h28"/>
    <path d="M758 58l5-6 4 3 5-6 4 2"/>
  </g>
  <circle class="dot" cx="756.5" cy="42" r="0.9"/>
  <circle class="dot" cx="759.5" cy="42" r="0.9"/>
  <text class="name" x="767" y="88">Web dashboard</text>
  <text class="desc" x="767" y="108">live view, events</text>
  <text class="desc" x="767" y="124">and controls</text>
</svg>
